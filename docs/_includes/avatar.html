<!-- Toggle Button -->
<button id="ai-toggle" style="
  background:#0366d6;
  color:white;
  padding:10px 16px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:16px;
  margin:20px 0;
">
  Open AI Assistant
</button>

<!-- Collapsible Container -->
<div id="ai-container" style="
  display:none;
  width:100%;
  max-width:500px;
  height:300px;
  margin:20px auto;
  border:1px solid #e1e4e8;
  border-radius:6px;
  padding:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
">
  <div id="genie-container" style="width:100%; height:100%;"></div>
</div>

<script type="module">
  // Toggle open/close
  const btn = document.getElementById('ai-toggle');
  const box = document.getElementById('ai-container');

  btn.addEventListener('click', () => {
    const isOpen = box.style.display === 'block';
    box.style.display = isOpen ? 'none' : 'block';
    btn.textContent = isOpen ? 'Open AI Assistant' : 'Close AI Assistant';
  });

  // Load the avatar
  try {
    const { embeds } = await import('https://unisphere.nvp1.ovp.kaltura.com/v1/loader/index.esm.js');
    const { destroy, apis } = await embeds.workspace({
      env: 'us',
      apis: ['genieChat'],
      session: {
        widgetId: '1_z5qi0rc5',
        partnerId: 6577933,
      },
    });
    const { remove } = apis.genieChat.contained({
      elementId: 'genie-container',
    });
  } catch (error) {
    console.error('Failed to create embeds:', error);
  }
</script>
